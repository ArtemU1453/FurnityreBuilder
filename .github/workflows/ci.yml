name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Порядок намеренный: сначала дешёвые проверки, затем сборка,
      # затем проверка собранного артефакта на самостоятельность.
      - run: npm run check:assumptions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:brand
      # Порог размера главного чанка: ловит библиотеку, въехавшую в
      # загрузку по умолчанию (docs/PERFORMANCE.md §1).
      - run: npm run check:bundle

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

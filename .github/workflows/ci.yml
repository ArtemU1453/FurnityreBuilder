name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Порядок намеренный: сначала дешёвые проверки, затем сборка,
      # затем проверка собранного артефакта на самостоятельность.
      - run: npm run check:assumptions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:brand
      # Порог размера главного чанка: ловит библиотеку, въехавшую в
      # загрузку по умолчанию (docs/PERFORMANCE_BUDGET.md §1).
      - run: npm run check:bundle
      # Состав пакета, манифест, service worker, отсутствие секретов и
      # отладочного вывода в собранных файлах (docs/RELEASE_CHECKLIST.md).
      - run: npm run check:release

      - run: npx playwright install --with-deps chromium
      # Проекты запускаются по отдельности: вместе они поднимают два
      # сервера и мешают друг другу. `chromium` идёт по production-сборке
      # — на ней же проверяются PWA, офлайн и чистота консоли.
      - run: npx playwright test --project=chromium
      - run: npx playwright test --project=chromium-dev

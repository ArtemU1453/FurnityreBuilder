# Ворота качества и выкладка (PROMPT 39, PROMPT 40).
#
# Один workflow, три задачи по цепочке:
#
#     verify → build-pages → deploy
#
# Так выкладка структурно не может обогнать проверки: `needs` не
# запускает задачу, пока предыдущая не завершилась успехом. Раньше
# публикация жила отдельным workflow и шла ПАРАЛЛЕЛЬНО с CI — коммит с
# красными воротами попал бы в production, и ничто бы этому не помешало.
#
# Второй выигрыш неочевиден, но важнее: выкладывается ровно тот коммит,
# который проверили. Связка через `workflow_run` этого не гарантирует —
# там задача берёт голову ветки, а она к моменту запуска может уже
# уехать вперёд.
#
# Всё, что здесь запускается, — реальные команды из `package.json`. Ни
# одной выдуманной: список сверен со `scripts`.
#
# Каждая проверка — отдельный шаг. Не ради красоты: упавший шаг видно по
# имени в списке, а не по поиску строки в журнале на тысячу строк.
name: CI

on:
  # Ветка по умолчанию — она же рабочая, и на неё идут прямые push.
  push:
    branches: [claude/furniture-designer-audit-cjvvuf]
  # Всё остальное проверяется через pull request. Так один и тот же
  # коммит не проверяется дважды.
  pull_request:
  workflow_dispatch:

# По умолчанию — только чтение. Права на публикацию выданы точечно, тем
# двум задачам, которым они нужны, и ни одной другой.
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон: держать очередь
# из проверок устаревшего кода незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Совпадает с `engines.node` в package.json (>=20).
          node-version: 22
          # Кэшируется только загрузка пакетов. Установка всё равно идёт
          # из lock-файла: кэш ускоряет, но не подменяет её.
          cache: npm

      - name: Установка из lock-файла
        run: npm ci

      # ── Дешёвые проверки идут первыми: падают быстро ──────────────
      - name: Реестр предположений
        run: npm run check:assumptions

      - name: Линтер и границы слоёв
        # Без --fix: CI проверяет репозиторий, а не правит его.
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      # Модульные, property- и интеграционные тесты — один прогон
      # vitest. Разделены каталогами, а не командами: гонять их тремя
      # запусками значило бы трижды поднимать один и тот же процесс
      # (docs/CI_QUALITY_GATES.md).
      - name: Тесты — модульные, property, интеграционные
        run: npm run test

      - name: Production-сборка
        run: npm run build

      # Сборка состоялась — проверяем то, что получилось.
      - name: Артефакт сборки на месте
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          ls dist/assets/index-*.js >/dev/null

      - name: Самостоятельность продукта
        run: npm run check:brand

      - name: Бюджеты производительности
        run: npm run check:bundle

      - name: Готовность пакета
        run: npm run check:release

      # Ссылка, по которой пользователь попадает в приложение. Сети не
      # трогает: доступность боевого адреса проверяет задача `smoke`
      # после выкладки, а эта обязана проходить на каждом pull request.
      - name: Целостность публичного входа
        run: npm run check:public

      # ── E2E ──────────────────────────────────────────────────────
      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      # Проекты запускаются по отдельности: вместе они поднимают два
      # сервера и мешают друг другу. `chromium` идёт по production-сборке
      # — на ней же проверяются PWA, офлайн и чистота консоли.
      - name: E2E — продукт на production-сборке
        run: npx playwright test --project=chromium

      # `chromium-dev` отвечает за технический debug-режим, которого в
      # production-сборке нет вовсе.
      - name: E2E — технический режим на dev-сервере
        run: npx playwright test --project=chromium-dev

      # Отчёт и трассы сохраняются ТОЛЬКО при падении: у зелёного
      # прогона их незачем хранить. Ни данных пользователя, ни секретов
      # в них нет — это сценарии на пустом браузере.
      - name: Диагностика упавшего E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Выкладка ─────────────────────────────────────────────────────
  #
  # Обе задачи идут только на push в ветку по умолчанию. Pull request
  # проходит ворота, но production не подменяет: проверка — не выпуск.
  build-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/furniture-designer-audit-cjvvuf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      # Имя кэша service worker'а содержит отпечаток содержимого сборки.
      # По нему дымовая проверка узнаёт, что по адресу лежит ИМЕННО ТО,
      # что собрали здесь, а не предыдущая версия (PROMPT 41 §11).
      cache: ${{ steps.stamp.outputs.cache }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Базовый путь берётся отсюда, а не пишется руками: страницы
      # проекта отдаются в подкаталоге `/репозиторий/`, а с собственным
      # доменом станут корнем. Сборка обязана заметить это сама
      # (docs/DEPLOYMENT.md §2).
      - id: pages
        name: Определить адрес и базовый путь Pages
        uses: actions/configure-pages@v5

      - name: Сборка под фактический базовый путь
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Согласованность базового пути в разметке, манифесте и service
      # worker'е. Разойдясь, они дают белый экран без единого сообщения —
      # и это последнее место, где такую сборку ещё можно не отдать людям.
      - name: Проверка пакета
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run check:release

      # Артефакт проверяется ПЕРЕД выгрузкой: это последнее место, где
      # пустую или неполную сборку ещё можно не отдать людям.
      - name: Артефакт пригоден к публикации
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          ls dist/assets/index-*.js >/dev/null
          ls dist/assets/index-*.css >/dev/null
          files=$(find dist -type f | wc -l)
          if [ "$files" -lt 10 ]; then
            echo "В пакете всего $files файлов — сборка неполная." >&2
            exit 1
          fi
          echo "Файлов в пакете: $files."

      - id: stamp
        name: Отпечаток сборки
        run: |
          cache=$(grep -oE 'furniture-builder-v[0-9A-Za-z.-]+' dist/sw.js | head -1)
          if [ -z "$cache" ]; then
            echo "В dist/sw.js не нашлось имени кэша — сборка не та, что ожидалась." >&2
            exit 1
          fi
          echo "Отпечаток: $cache"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"

      # Выгружается только `dist/`. Ни исходников, ни node_modules, ни
      # тестов, ни конфигурации разработки.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/furniture-designer-audit-cjvvuf'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # Адрес берётся из вывода самой выкладки, а не пишется руками:
      # проверяться должно ровно то, что опубликовано (PROMPT 41 §9).
      url: ${{ steps.deployment.outputs.page_url }}
    # Публикации не наслаиваются. Начатую не обрываем: оборванная на
    # середине выкладка оставила бы людям половину сборки. Очередь при
    # этом не копится — GitHub держит в ней только самый свежий прогон,
    # поэтому старая версия не может встать поверх новой.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Дымовая проверка опубликованного ─────────────────────────────
  #
  # Успешная выкладка не доказывает, что приложение работает. Между
  # зелёным прогоном и живой страницей лежит чужой хостинг, его
  # заголовки, его кэш и базовый путь. Сборка под неверную базу не
  # падает — она отдаёт белый экран, и до этой проверки его увидел бы
  # пользователь, а не CI.
  #
  # Это НЕ повтор набора E2E: тот прошёл выше и отвечает за
  # функциональность. Здесь ищутся дефекты именно выкладки, и на это
  # уходят секунды.
  smoke:
    needs: [build-pages, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/furniture-designer-audit-cjvvuf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Ожидание не «на всякий случай»: у него есть условие готовности.
      # Ждём, пока по адресу окажется service worker С ТЕМ САМЫМ именем
      # кэша, которое собрали в build-pages. Значит доехала именно эта
      # версия, а не предыдущая.
      #
      # Предел жёсткий: 30 попыток по 10 секунд — пять минут. Дальше шаг
      # падает, а не ждёт вечно и не притворяется успешным.
      - name: Дождаться, пока выложенное доедет
        env:
          URL: ${{ needs.deploy.outputs.url }}
          CACHE: ${{ needs.build-pages.outputs.cache }}
        run: |
          echo "Адрес:     $URL"
          echo "Отпечаток: $CACHE"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 15 "${URL}sw.js" 2>/dev/null || true)
            if printf '%s' "$body" | grep -qF "$CACHE"; then
              echo "Готово с попытки $attempt."
              exit 0
            fi
            echo "Попытка $attempt: выложенного ещё нет, ждём 10 с."
            sleep 10
          done
          echo "За пять минут по адресу так и не появилась выложенная версия." >&2
          exit 1

      # Треугольник замыкается здесь: README, документация и ФАКТИЧЕСКИЙ
      # адрес выкладки обязаны совпасть. Проверка входа выше сверяет
      # README с вычисленным ожиданием; этот шаг сверяет то же ожидание с
      # тем, что реально отдала выкладка.
      - name: Ссылка в README совпадает с адресом выкладки
        env:
          DEPLOYED: ${{ needs.deploy.outputs.url }}
        run: |
          link=$(grep -oE 'https://[a-z0-9-]+\.github\.io/[^)]*' README.md | head -1)
          echo "README:  $link"
          echo "Выкладка: $DEPLOYED"
          if [ "$link" != "$DEPLOYED" ]; then
            echo "README ведёт не туда, куда выложено приложение." >&2
            exit 1
          fi

      - name: Дымовая проверка опубликованного приложения
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: npm run smoke

      # Отчёт, трассы и снимки экрана — только при падении. Секретов в
      # них нет: сценарий работает в пустом браузере на публичном адресе.
      - name: Диагностика упавшей проверки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore


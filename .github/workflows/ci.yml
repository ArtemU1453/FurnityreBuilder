# Ворота качества и выкладка (PROMPT 39, PROMPT 40).
#
# Один workflow, три задачи по цепочке:
#
#     verify → build-pages → deploy
#
# Так выкладка структурно не может обогнать проверки: `needs` не
# запускает задачу, пока предыдущая не завершилась успехом. Раньше
# публикация жила отдельным workflow и шла ПАРАЛЛЕЛЬНО с CI — коммит с
# красными воротами попал бы в production, и ничто бы этому не помешало.
#
# Второй выигрыш неочевиден, но важнее: выкладывается ровно тот коммит,
# который проверили. Связка через `workflow_run` этого не гарантирует —
# там задача берёт голову ветки, а она к моменту запуска может уже
# уехать вперёд.
#
# Всё, что здесь запускается, — реальные команды из `package.json`. Ни
# одной выдуманной: список сверен со `scripts`.
#
# Каждая проверка — отдельный шаг. Не ради красоты: упавший шаг видно по
# имени в списке, а не по поиску строки в журнале на тысячу строк.
name: CI

on:
  # Ветка по умолчанию — она же рабочая, и на неё идут прямые push.
  push:
    branches: [claude/furniture-designer-audit-cjvvuf]
  # Всё остальное проверяется через pull request. Так один и тот же
  # коммит не проверяется дважды.
  pull_request:
  workflow_dispatch:

# По умолчанию — только чтение. Права на публикацию выданы точечно, тем
# двум задачам, которым они нужны, и ни одной другой.
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон: держать очередь
# из проверок устаревшего кода незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Совпадает с `engines.node` в package.json (>=20).
          node-version: 22
          # Кэшируется только загрузка пакетов. Установка всё равно идёт
          # из lock-файла: кэш ускоряет, но не подменяет её.
          cache: npm

      - name: Установка из lock-файла
        run: npm ci

      # ── Дешёвые проверки идут первыми: падают быстро ──────────────
      - name: Реестр предположений
        run: npm run check:assumptions

      - name: Линтер и границы слоёв
        # Без --fix: CI проверяет репозиторий, а не правит его.
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      # Модульные, property- и интеграционные тесты — один прогон
      # vitest. Разделены каталогами, а не командами: гонять их тремя
      # запусками значило бы трижды поднимать один и тот же процесс
      # (docs/CI_QUALITY_GATES.md).
      - name: Тесты — модульные, property, интеграционные
        run: npm run test

      - name: Production-сборка
        run: npm run build

      # Сборка состоялась — проверяем то, что получилось.
      - name: Артефакт сборки на месте
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          ls dist/assets/index-*.js >/dev/null

      - name: Самостоятельность продукта
        run: npm run check:brand

      - name: Размер главного чанка
        run: npm run check:bundle

      - name: Готовность пакета
        run: npm run check:release

      # ── E2E ──────────────────────────────────────────────────────
      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      # Проекты запускаются по отдельности: вместе они поднимают два
      # сервера и мешают друг другу. `chromium` идёт по production-сборке
      # — на ней же проверяются PWA, офлайн и чистота консоли.
      - name: E2E — продукт на production-сборке
        run: npx playwright test --project=chromium

      # `chromium-dev` отвечает за технический debug-режим, которого в
      # production-сборке нет вовсе.
      - name: E2E — технический режим на dev-сервере
        run: npx playwright test --project=chromium-dev

      # Отчёт и трассы сохраняются ТОЛЬКО при падении: у зелёного
      # прогона их незачем хранить. Ни данных пользователя, ни секретов
      # в них нет — это сценарии на пустом браузере.
      - name: Диагностика упавшего E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Выкладка ─────────────────────────────────────────────────────
  #
  # Обе задачи идут только на push в ветку по умолчанию. Pull request
  # проходит ворота, но production не подменяет: проверка — не выпуск.
  build-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/furniture-designer-audit-cjvvuf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Базовый путь берётся отсюда, а не пишется руками: страницы
      # проекта отдаются в подкаталоге `/репозиторий/`, а с собственным
      # доменом станут корнем. Сборка обязана заметить это сама
      # (docs/DEPLOYMENT.md §2).
      - id: pages
        name: Определить адрес и базовый путь Pages
        uses: actions/configure-pages@v5

      - name: Сборка под фактический базовый путь
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Согласованность базового пути в разметке, манифесте и service
      # worker'е. Разойдясь, они дают белый экран без единого сообщения —
      # и это последнее место, где такую сборку ещё можно не отдать людям.
      - name: Проверка пакета
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run check:release

      # Выгружается только `dist/`. Ни исходников, ни node_modules, ни
      # тестов, ни конфигурации разработки.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/furniture-designer-audit-cjvvuf'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Публикации не наслаиваются. Начатую не обрываем: оборванная на
    # середине выкладка оставила бы людям половину сборки. Очередь при
    # этом не копится — GitHub держит в ней только самый свежий прогон,
    # поэтому старая версия не может встать поверх новой.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

